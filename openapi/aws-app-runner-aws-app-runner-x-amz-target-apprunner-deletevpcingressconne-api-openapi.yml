    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteVpcIngressConnection
      description: 'Delete an App Runner VPC Ingress Connection resource that''s associated with an App Runner service. The VPC Ingress Connection must be in one of the following states to be deleted:


        AVAILABLE


        FAILED_CREATION


        FAILED_UPDATE


        FAILED_DELETION'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVpcIngressConnectionResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: InternalServiceErrorException
          content:
