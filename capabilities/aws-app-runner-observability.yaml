naftiko: 1.0.0-alpha2
info:
  label: AWS App Runner API — Observability
  description: 'AWS App Runner API — Observability. 1 operations. Lead operation: AWS App Runner Create an Observability Configuration.
    Self-contained Naftiko capability covering one Aws App Runner business surface.'
  tags:
  - Aws App Runner
  - Observability
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_APP_RUNNER_API_KEY: AWS_APP_RUNNER_API_KEY
capability:
  consumes:
  - type: http
    namespace: aws-app-runner-observability
    baseUri: https://apprunner.{region}.amazonaws.com
    description: AWS App Runner API — Observability business capability. Self-contained, no shared references.
    resources:
    - name: '#CreateObservabilityConfiguration'
      path: /#CreateObservabilityConfiguration
      operations:
      - name: createobservabilityconfiguration
        method: POST
        description: AWS App Runner Create an Observability Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_APP_RUNNER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aws-app-runner-observability-rest
    port: 8080
    description: REST adapter for AWS App Runner API — Observability. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/createobservabilityconfiguration
      name: createobservabilityconfiguration
      description: 'REST surface for #CreateObservabilityConfiguration.'
      operations:
      - method: POST
        name: createobservabilityconfiguration
        description: AWS App Runner Create an Observability Configuration
        call: aws-app-runner-observability.createobservabilityconfiguration
        with:
          X-Amz-Target: rest.X-Amz-Target
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aws-app-runner-observability-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS App Runner API — Observability. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: aws-app-runner-create-observability
      description: AWS App Runner Create an Observability Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: aws-app-runner-observability.createobservabilityconfiguration
      with:
        X-Amz-Target: tools.X-Amz-Target
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
