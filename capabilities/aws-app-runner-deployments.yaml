      outputParameters:
      - type: object
        mapping: $.
    - name: aws-app-runner-start-deployment
      description: AWS App Runner Start a Deployment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: aws-app-runner-deployments.startdeployment
