    description: AWS App Runner API — Deployments business capability. Self-contained, no shared references.
    resources:
    - name: '#ListOperations'
      path: /#ListOperations
      operations:
      - name: listoperations
        method: POST
        description: AWS App Runner List Operations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: '#StartDeployment'
      path: /#StartDeployment
      operations:
      - name: startdeployment
        method: POST
        description: AWS App Runner Start a Deployment
        outputRawFormat: json
