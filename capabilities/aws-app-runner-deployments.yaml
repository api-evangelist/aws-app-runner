  - Aws App Runner
  - Deployments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_APP_RUNNER_API_KEY: AWS_APP_RUNNER_API_KEY
capability:
